<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>分岐と反復の練習</title>
  </head>
    <body>
    <div id="main" class="box">こんにちは</div>
    <p class="box">段落1</p>
    <p class="box">段落2</p>

    <script>
      const idElement = document.getElementById("main");
      const classElements = document.getElementsByClassName("box");
      const queryElement = document.querySelector(".box");
      const queryElements = document.querySelectorAll(".box");

      console.log(idElement);
      console.log(classElements);
      console.log(queryElement);
      console.log(queryElements);
    </script>
  </body>
</html>
