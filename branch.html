<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>分岐と反復の練習</title>
  </head>
  <body>
    <script>
      const a = prompt("10");
      const b = prompt("9");

      if (a > b) {
        alert("1つ目の方が大きい");
      } else if (a < b) {
        alert("2つ目の方が大きい");
      } else {
        alert("同じです");
      }
    </script>
  </body>
</html>
